name: Build check

on:
  push:
    branches:
      - main
      - feature/bike-quest-v1
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Appearance boundary tests
        run: npm run test:theme

      - name: Type-check and build
        run: npm run build
