name: Build check

on:
  push:
    branches:
      - main
      - feature/bike-quest-v1
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Appearance boundary tests
        run: npm run test:theme

      - name: Type-check and build
        run: npm run build

      - name: Sync Capacitor Android
        if: ${{ always() }}
        run: npx cap sync android

      - name: Compile Android Java
        if: ${{ always() }}
        working-directory: android
        run: bash ./gradlew :app:compileDebugJavaWithJavac --no-daemon
