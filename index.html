<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d1b" />
    <meta name="color-scheme" content="dark" />
    <style id="appearance-bootstrap">html,body{background:#080d1b;color:#eef2ff}</style>
    <script>
      (() => {
        document.documentElement.dataset.appearance = "dark";
        document.documentElement.style.colorScheme = "dark";
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#080d1b");
        const bootstrapStyle = document.getElementById("appearance-bootstrap");
        if (bootstrapStyle) bootstrapStyle.textContent = "html,body{background:#080d1b;color:#eef2ff}";
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Zen Chad — Your Wellness Adventure</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
